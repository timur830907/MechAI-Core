<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MechAI-Core | Инженерная платформа расчета и ИИ</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .metric-card {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
        }

        .metric-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        canvas {
            width: 100%;
            height: 280px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 16px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .status-optimal { background-color: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; }
        .status-warning { background-color: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid #9e6a03; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Панель параметров -->
        <div class="panel">
            <h1>MechAI-Core</h1>
            <div class="subtitle">Параметрический расчет и анализ зубчатой передачи</div>

            <form id="gearForm">
                <div class="form-group">
                    <label for="module">Модуль зацепления (m, мм):</label>
                    <input type="number" id="module" value="3.0" step="0.5" min="0.5" required>
                </div>

                <div class="form-group">
                    <label for="teeth">Количество зубьев (z):</label>
                    <input type="number" id="teeth" value="24" step="1" min="6" required>
                </div>

                <div class="form-group">
                    <label for="face_width">Ширина венца (b, мм):</label>
                    <input type="number" id="face_width" value="35.0" step="1" min="5" required>
                </div>

                <div class="form-group">
                    <label for="torque">Крутящий момент (T, Н·м):</label>
                    <input type="number" id="torque" value="150.0" step="10" min="1" required>
                </div>

                <button type="submit" class="btn">Выполнить расчет и анализ</button>
            </form>
            
            <div style="margin-top: 15px;">
                <div id="statusBadge" class="status-badge status-optimal">Система готова к расчету</div>
            </div>
        </div>

        <!-- Панель результатов и визуализации -->
        <div class="panel">
            <h1>Результаты и Визуализация</h1>
            <div class="subtitle">Геометрия, напряжения и Physics AI суррогатная модель</div>

            <canvas id="gearCanvas"></canvas>

            <div class="results-grid">
                <div class="metric-card">
                    <div class="metric-title">Делит. диаметр</div>
                    <div class="metric-value" id="resPitch">-</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Диаметр вершин</div>
                    <div class="metric-value" id="resOuter">-</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Изгибное напряжение</div>
                    <div class="metric-value" id="resBending">-</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Коэффициент запаса</div>
                    <div class="metric-value" id="resSafety">-</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">КПД (Physics AI)</div>
                    <div class="metric-value" id="resEfficiency">-</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Прогноз t° макс</div>
                    <div class="metric-value" id="resTemp">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === "localhost" 
            ? "http://127.0.0.1:8000/api/analyze-gear" 
            : "https://mechai-core.onrender.com/api/analyze-gear";

        const canvas = document.getElementById('gearCanvas');
        const ctx = canvas.getContext('2d');

        function drawGear(teeth, module) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = (module * teeth) / 2 * 2.2;

            ctx.save();
            ctx.translate(cx, cy);
            
            // Тело шестерни
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#1f242c';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#58a6ff';
            ctx.stroke();

            // Делительная окружность
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.85, 0, Math.PI * 2);
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#8b949e';
            ctx.stroke();
            ctx.setLineDash([]);

            // Зубья шестерни
            for (let i = 0; i < teeth; i++) {
                const angle = (i * 2 * Math.PI) / teeth;
                ctx.rotate(angle);
                ctx.fillStyle = '#58a6ff';
                ctx.fillRect(radius - 5, -4, 10, 8);
                ctx.rotate(-angle);
            }

            // Отверстие вала
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#0d1117';
            ctx.fill();
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.restore();
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 48;
            canvas.height = 260;
            drawGear(parseInt(document.getElementById('teeth').value), parseFloat(document.getElementById('module').value));
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => {
            resizeCanvas();
            sendRequest();
        });

        document.getElementById('gearForm').addEventListener('submit', function(e) {
            e.preventDefault();
            sendRequest();
        });

        async function sendRequest() {
            const data = {
                module: parseFloat(document.getElementById('module').value),
                teeth: parseInt(document.getElementById('teeth').value),
                face_width: parseFloat(document.getElementById('face_width').value),
                torque: parseFloat(document.getElementById('torque').value)
            };

            drawGear(data.teeth, data.module);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Ошибка связи с сервером');

                const result = await response.json();

                document.getElementById('resPitch').innerText = result.geometry.pitch_diameter_mm + " мм";
                document.getElementById('resOuter').innerText = result.geometry.outer_diameter_mm + " мм";
                document.getElementById('resBending').innerText = result.mechanics.bending_stress_mpa + " МПа";
                document.getElementById('resSafety').innerText = result.mechanics.safety_factor;
                document.getElementById('resEfficiency').innerText = result.ai_prediction.estimated_efficiency_percent + " %";
                document.getElementById('resTemp').innerText = result.ai_prediction.predicted_max_temperature_c + " °C";

                const badge = document.getElementById('statusBadge');
                if (result.mechanics.is_safe) {
                    badge.className = "status-badge status-optimal";
                    badge.innerText = "Статус: Конструкция надежна (Optimal)";
                } else {
                    badge.className = "status-badge status-warning";
                    badge.innerText = "Внимание: Превышение напряжений!";
                }

            } catch (error) {
                alert('Не удалось выполнить запрос: ' + error.message);
            }
        }
    </script>
</body>
</html>
