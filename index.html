<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MechAI-Core — CAE & Physics AI Суфлер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 440px; background: #111827; border-right: 1px solid #1f2937; padding: 24px; overflow-y: auto; }
        .main-content { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        h1 { font-size: 22px; color: #60a5fa; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #9ca3af; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: #d1d5db; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: white; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .btn-secondary { background: #374151; margin-top: 8px; }
        .btn-secondary:hover { background: #4b5563; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-top: 14px; }
        .status-optimal { background: #064e3b; color: #34d399; }
        .status-warning { background: #7f1d1d; color: #f87171; }
        
        .visual-panel { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
        canvas { background: #080c14; border-radius: 8px; border: 1px solid #1f2937; }
        
        .grid-results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 16px; }
        .card-title { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-bottom: 6px; }
        .card-value { font-size: 20px; font-weight: 700; color: #60a5fa; }
        .legend { display: flex; gap: 15px; margin-top: 10px; font-size: 11px; color: #9ca3af; align-items: center; }
        .legend-box { width: 12px; height: 12px; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>MechAI-Core</h1>
        <div class="subtitle">CAE-расчет и тепловая карта напряжений</div>
        
        <div class="form-group">
            <label>Материал шестерни:</label>
            <select id="material">
                <option value="steel_40x">Сталь 40Х (улучшенная)</option>
                <option value="steel_45">Сталь 45 (нормализация)</option>
                <option value="bronze_br_o10f1">Бронза БрО10Ф1</option>
                <option value="delrin_pom">Полиацеталь (POM-C)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Модуль зацепления (m, мм):</label>
            <input type="number" id="module" value="3.0" step="0.5">
        </div>
        <div class="form-group">
            <label>Количество зубьев (z):</label>
            <input type="number" id="teeth" value="24" step="1">
        </div>
        <div class="form-group">
            <label>Ширина венца (b, мм):</label>
            <input type="number" id="width" value="35.0" step="1">
        </div>
        <div class="form-group">
            <label>Крутящий момент (T, Н*м):</label>
            <input type="number" id="torque" value="150.0" step="5">
        </div>

        <button onclick="calculate()">Выполнить расчет и CAE-анализ</button>
        <button class="btn-secondary" onclick="exportPDF()">Скачать отчет в PDF</button>
        
        <div id="statusBadge" class="status-badge status-optimal">Статус: Готов к расчету</div>
    </div>

    <div class="main-content">
        <div class="visual-panel">
            <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 14px; font-weight: 600; color: #d1d5db;">Тепловая карта напряжений и анимация зацепления</span>
                <div class="legend">
                    <div style="display:flex; align-items:center; gap:4px;"><div class="legend-box" style="background:#3b82f6;"></div> Норма</div>
                    <div style="display:flex; align-items:center; gap:4px;"><div class="legend-box" style="background:#ef4444;"></div> Нагрузка / Пик</div>
                </div>
            </div>
            <canvas id="gearCanvas" width="600" height="260"></canvas>
        </div>

        <div class="grid-results">
            <div class="card">
                <div class="card-title">Делит. диаметр</div>
                <div class="card-value" id="res_d">-</div>
            </div>
            <div class="card">
                <div class="card-title">Диаметр вершин</div>
                <div class="card-value" id="res_da">-</div>
            </div>
            <div class="card">
                <div class="card-title">Изгибное напряжение</div>
                <div class="card-value" id="res_stress">-</div>
            </div>
            <div class="card">
                <div class="card-title">Коэффициент запаса</div>
                <div class="card-value" id="res_safety">-</div>
            </div>
            <div class="card">
                <div class="card-title">КПД (Physics AI)</div>
                <div class="card-value" id="res_eff">-</div>
            </div>
            <div class="card">
                <div class="card-title">Прогноз T макс</div>
                <div class="card-value" id="res_temp">-</div>
            </div>
        </div>
    </div>

    <script>
        let angle1 = 0;
        let currentStressRatio = 0.5;

        async function calculate() {
            const payload = {
                material: document.getElementById('material').value,
                module: parseFloat(document.getElementById('module').value),
                teeth: parseInt(document.getElementById('teeth').value),
                width: parseFloat(document.getElementById('width').value),
                torque: parseFloat(document.getElementById('torque').value)
            };

            try {
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                document.getElementById('res_d').innerText = data.pitch_diameter + ' мм';
                document.getElementById('res_da').innerText = data.tip_diameter + ' мм';
                document.getElementById('res_stress').innerText = data.bending_stress + ' МПа';
                document.getElementById('res_safety').innerText = data.safety_factor;
                document.getElementById('res_eff').innerText = data.efficiency + ' %';
                document.getElementById('res_temp').innerText = data.max_temperature + ' °C';

                currentStressRatio = Math.min(1.0, data.bending_stress / data.allowable_bending_stress);

                const badge = document.getElementById('statusBadge');
                if (data.status === 'Optimal') {
                    badge.className = 'status-badge status-optimal';
                    badge.innerText = 'Статус: Конструкция надежна (Optimal)';
                } else {
                    badge.className = 'status-badge status-warning';
                    badge.innerText = 'Статус: Превышение напряжений (Warning)';
                }
            } catch (err) {
                alert('Ошибка соединения с бэкендом: ' + err.message);
            }
        }

        async function exportPDF() {
            const payload = {
                material: document.getElementById('material').value,
                module: parseFloat(document.getElementById('module').value),
                teeth: parseInt(document.getElementById('teeth').value),
                width: parseFloat(document.getElementById('width').value),
                torque: parseFloat(document.getElementById('torque').value)
            };

            try {
                const response = await fetch('/api/export-pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mechai_gear_report.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (error) {
                alert('Не удалось скачать PDF: ' + error.message);
            }
        }

        // Рендеринг анимации и тепловой карты на Canvas
        const canvas = document.getElementById('gearCanvas');
        const ctx = canvas.getContext('2d');
        const teethCount = 24;

        function drawGear(cx, cy, radius, angle, stressRatio) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            // Обод шестерни с тепловой картой
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.lineWidth = 3;
            
            // Цвет контура зависит от уровня напряжения (Heatmap)
            let strokeColor = '#3b82f6';
            if (stressRatio > 0.8) strokeColor = '#ef4444';
            else if (stressRatio > 0.5) strokeColor = '#f59e0b';
            ctx.strokeStyle = strokeColor;
            ctx.stroke();

            // Зубья шестерни с CAE подсветкой корня
            const outerR = radius + 8;
            for (let i = 0; i < teethCount; i++) {
                ctx.rotate((Math.PI * 2) / teethCount);
                ctx.beginPath();
                ctx.moveTo(-4, -radius);
                ctx.lineTo(-6, -outerR);
                ctx.lineTo(6, -outerR);
                ctx.lineTo(4, -radius);
                
                // Градиент напряжения на зубе
                ctx.fillStyle = stressRatio > 0.7 ? '#ef4444' : '#3b82f6';
                ctx.fill();
            }

            // Центральное отверстие вала
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
            ctx.fillStyle = '#0b0f19';
            ctx.fill();
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const z1 = 24;
            const z2 = 24;
            const r = 75;

            // Взаимосвязанное вращение двух шестерен
            angle1 += 0.015;
            let angle2 = -angle1 * (z1 / z2) + Math.PI / z1;

            drawGear(180, 130, r, angle1, currentStressRatio);
            drawGear(180 + r * 2, 130, r, angle2, currentStressRatio);

            requestAnimationFrame(animate);
        }

        // Автоматический расчет при загрузке
        calculate();
        animate();
    </script>
</body>
</html>
